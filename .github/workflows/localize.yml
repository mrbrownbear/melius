name: Localize Melius

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize.yml'
      - 'scripts/localize.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Capture and localize site
        run: python scripts/localize.py

      - name: Replace repository with localized static build
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name scripts ! -name site -exec rm -rf {} +
          cp -a site/. .
          rm -rf site

      - name: Commit localized build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Localize Melius static site"
          git push origin main

# trigger after workflow registration
