name: Verify Localized Static Site

on:
  push:
    branches: [main, localize-run]
    paths:
      - '.github/workflows/verify-local.yml'
      - 'tools/verify_static.py'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.json'
      - '**/*.svg'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.eot'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.avif'
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.dmg'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static site is Git only
        run: python tools/verify_static.py
